COMMANDS:
  list:
    "~dm":
      run: [in: docker, cmd: python, manage.py]
    "~just":
      run: [in: docker, cmd: just]
    "~serve":
      run: [in: docker, cmd: just, run-server]
    "~shell":
      run: [in: docker, cmd: fish]

DOCKER:
  container: blogs_be

ROOT: {}

SERVER:
  install_dir: /app
  src_dir: ${/SERVER/install_dir}/src

