COMMANDS:
  list:
    "~build":
      run: [cmd: just, build, ""]
    "~down":
      run: [cmd: just, down]
    "~restart":
      run: [cmd: just, restart]
    "~mt":
      run: [cmd: dodo, root.menu, --tmux]
    "~up":
      run: [cmd: just, up]

MENU:
  session_id: blogs
  commands:
    serve:
      - dodo blogs_be.serve
      - dodo blogs_fe.serve

ROOT: {}
