tmux:
  session: blogs
  menu:
    examples:
      - whoami
      - date
      - uptime
    serve:
      - zoo docker.exec blogs_be cmd="jaz run-server"
      - zoo docker.exec blogs_fe cmd="jaz run-server"
edit_config:
  editor: gedit
  files:
    - env/local/config/*.yaml
docker:
  compose_project: blogs
  shell: sh
compose:
  use_dockerfile_local: false
  os_custom_packages: ""
  pip_custom_packages: ""
  init:
    homepage: http://localhost:3000/
python:
  services:
    - blogs_be
  pypi:
    username: __token__
    publish_url: https://upload.pypi.org/legacy/
dial:
  default:
    1: zoo docker.exec be
    2: zoo docker.exec fe
    3: zoo config.print
  shift:
    1: .
    2: src/services/blogs_be
    3: src/services/blogs_fe
  ctrl:
    1: env/local
    2: env/local/config
    3: "~"
